org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Workaround for "Could not close incremental caches ... .tab" failures of
# the Kotlin compiler on Windows (stale/locked incremental caches in
# build\<plugin>\kotlin\compileDebugKotlin\cacheable\caches-jvm\...).
# Turning incremental compilation off alone is not always enough: Kotlin
# still maintains the classpath-snapshot lookup caches that fail to close,
# so disable those and the Kotlin build-cache integration as well, and let
# the compiler fall back to in-process compilation if the Kotlin daemon
# dies or its file handles get locked (antivirus / leftover daemons on
# Windows are the usual cause). Slightly slower, but builds complete.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.caching.enabled=false
kotlin.daemon.useFallbackStrategy=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
